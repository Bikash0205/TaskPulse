<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskPulse Logo Generator</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 40px;
      background: #f8fafc;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #full-logo-box {
      width: 480px;
      height: 140px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #square-icon-box {
      width: 512px;
      height: 512px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      border-radius: 32px;
    }
  </style>
</head>
<body>

  <!-- 1. Full Horizontal Logo Container -->
  <div id="full-logo-box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="440" height="110" fill="none">
      <defs>
        <filter id="emerald-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.5" result="blur" />
          <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.062 0 0 0 0 0.725 0 0 0 0 0.505 0 0 0 0.85 0" result="coloredBlur" />
          <feMerge>
            <feMergeNode in="coloredBlur" />
            <feMergeNode in="coloredBlur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="pulse-blue-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <linearGradient id="arrow-grad" x1="95" y1="25" x2="105" y2="15" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#34D399" />
          <stop offset="100%" stopColor="#10B981" />
        </linearGradient>
        <linearGradient id="pulse-grad" x1="10" y1="35" x2="105" y2="15" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#3B82F6" />
          <stop offset="60%" stopColor="#2563EB" />
          <stop offset="100%" stopColor="#10B981" />
        </linearGradient>
      </defs>

      <g id="pulse-mark">
        <polyline points="10,35 30,35 40,48 55,18 68,42 80,28 92,35 105,15" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#pulse-blue-glow)" />
        <polyline points="10,35 30,35 40,48 55,18 68,42 80,28 92,35 105,15" stroke="url(#pulse-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <polyline points="95,15 105,15 105,25" stroke="url(#arrow-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#emerald-glow)" />
        <circle cx="105" cy="15" r="3.5" fill="#FFFFFF" filter="url(#emerald-glow)" />
      </g>

      <text x="122" y="39" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.03em">
        Task<tspan fill="#10B981">Pulse</tspan>
      </text>
    </svg>
  </div>

  <!-- 2. Square App Icon for Google OAuth Container -->
  <div id="square-icon-box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="340" height="200" fill="none">
      <defs>
        <filter id="emerald-glow-sq" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="pulse-blue-glow-sq" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <linearGradient id="arrow-grad-sq" x1="95" y1="25" x2="105" y2="15" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#34D399" />
          <stop offset="100%" stopColor="#10B981" />
        </linearGradient>
        <linearGradient id="pulse-grad-sq" x1="10" y1="35" x2="105" y2="15" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#3B82F6" />
          <stop offset="60%" stopColor="#2563EB" />
          <stop offset="100%" stopColor="#10B981" />
        </linearGradient>
      </defs>

      <g transform="translate(0, 5)">
        <polyline points="10,35 30,35 40,48 55,18 68,42 80,28 92,35 105,15" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#pulse-blue-glow-sq)" />
        <polyline points="10,35 30,35 40,48 55,18 68,42 80,28 92,35 105,15" stroke="url(#pulse-grad-sq)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
        <polyline points="95,15 105,15 105,25" stroke="url(#arrow-grad-sq)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#emerald-glow-sq)" />
        <circle cx="105" cy="15" r="4.5" fill="#FFFFFF" filter="url(#emerald-glow-sq)" />
      </g>
    </svg>

    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; color: #0F172A; letter-spacing: -0.03em;">
      Task<span style="color: #10B981;">Pulse</span>
    </div>
  </div>

</body>
</html>
