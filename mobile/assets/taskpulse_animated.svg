<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="tpAnimGrad" x1="0%" y1="60%" x2="100%" y2="10%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2242D8" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="72%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="softAnimShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1E293B" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    @keyframes drawPulse {
      0% {
        stroke-dashoffset: 1200;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes snapWings {
      0%, 65% {
        opacity: 0;
        transform: scale(0.4);
      }
      80% {
        opacity: 1;
        transform: scale(1.15);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes popTarget {
      0%, 75% {
        opacity: 0;
        transform: scale(0);
      }
      88% {
        opacity: 1;
        transform: scale(1.2);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes revealText {
      0%, 78% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tp-anim-line {
      fill: none;
      stroke: url(#tpAnimGrad);
      stroke-width: 34;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 0;
      animation: drawPulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      filter: url(#softAnimShadow);
    }

    .tp-anim-wings {
      transform-origin: 725px 65px;
      animation: snapWings 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .tp-anim-wing-bar {
      fill: none;
      stroke: #10B981;
      stroke-width: 32;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#softAnimShadow);
    }

    .tp-anim-ring {
      transform-origin: 725px 65px;
      animation: popTarget 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      fill: #FFFFFF;
      stroke: #10B981;
      stroke-width: 14;
      filter: url(#softAnimShadow);
    }

    .tp-anim-typography {
      animation: revealText 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .tp-text-task {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 112px;
      fill: #182230;
      letter-spacing: -2px;
    }

    .tp-text-pulse {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 112px;
      fill: #10B981;
      letter-spacing: -2px;
    }
  </style>

  <g transform="translate(48, 40)">
    <!-- Dynamically Drawn Pulse Line -->
    <path class="tp-anim-line" d="M 60,195 L 205,195 L 275,285 L 385,75 L 475,250 L 560,150 L 640,205 L 725,65" />

    <!-- Snapping Wings Group -->
    <g class="tp-anim-wings">
      <line class="tp-anim-wing-bar" x1="725" y1="65" x2="645" y2="65" />
      <line class="tp-anim-wing-bar" x1="725" y1="65" x2="725" y2="145" />
    </g>

    <!-- Popping Bullseye Target Ring -->
    <circle class="tp-anim-ring" cx="725" cy="65" r="24" />

    <!-- Smoothly Revealed Typography -->
    <g class="tp-anim-typography" transform="translate(42, 485)">
      <text class="tp-text-task" x="50" y="0">Task<tspan class="tp-text-pulse">Pulse</tspan></text>
    </g>
  </g>
</svg>
