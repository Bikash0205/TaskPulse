<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Luminous Neon Gradient for Dark Mode -->
    <linearGradient id="tpDarkAnimGrad" x1="0%" y1="60%" x2="100%" y2="10%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="30%" stop-color="#60A5FA" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="78%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Neon Ambient Glow -->
    <filter id="neonDarkAnimShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#10B981" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="8" stdDeviation="22" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    @keyframes drawPulse {
      0% {
        stroke-dashoffset: 1200;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes snapWings {
      0%, 65% {
        opacity: 0;
        transform: scale(0.4);
      }
      80% {
        opacity: 1;
        transform: scale(1.15);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes popTarget {
      0%, 75% {
        opacity: 0;
        transform: scale(0);
      }
      88% {
        opacity: 1;
        transform: scale(1.2);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes revealText {
      0%, 78% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tp-anim-line-dark {
      fill: none;
      stroke: url(#tpDarkAnimGrad);
      stroke-width: 34;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 0;
      animation: drawPulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      filter: url(#neonDarkAnimShadow);
    }

    .tp-anim-wings-dark {
      transform-origin: 725px 65px;
      animation: snapWings 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .tp-anim-wing-bar-dark {
      fill: none;
      stroke: #34D399;
      stroke-width: 32;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neonDarkAnimShadow);
    }

    .tp-anim-ring-dark {
      transform-origin: 725px 65px;
      animation: popTarget 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      fill: #0B0F19;
      stroke: #34D399;
      stroke-width: 14;
      filter: url(#neonDarkAnimShadow);
    }

    .tp-anim-typography-dark {
      animation: revealText 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .tp-text-task-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 112px;
      fill: #F8FAFC;
      letter-spacing: -2px;
    }

    .tp-text-pulse-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 112px;
      fill: #34D399;
      letter-spacing: -2px;
    }
  </style>

  <g transform="translate(48, 40)">
    <!-- Dynamically Drawn Pulse Line -->
    <path class="tp-anim-line-dark" d="M 60,195 L 205,195 L 275,285 L 385,75 L 475,250 L 560,150 L 640,205 L 725,65" />

    <!-- Snapping Wings Group -->
    <g class="tp-anim-wings-dark">
      <line class="tp-anim-wing-bar-dark" x1="725" y1="65" x2="645" y2="65" />
      <line class="tp-anim-wing-bar-dark" x1="725" y1="65" x2="725" y2="145" />
    </g>

    <!-- Popping Bullseye Target Ring -->
    <circle class="tp-anim-ring-dark" cx="725" cy="65" r="24" />

    <!-- Smoothly Revealed Typography -->
    <g class="tp-anim-typography-dark" transform="translate(42, 485)">
      <text class="tp-text-task-dark" x="50" y="0">Task<tspan class="tp-text-pulse-dark">Pulse</tspan></text>
    </g>
  </g>
</svg>
