<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Vibrant Pulse Linear Gradient -->
    <linearGradient id="tpGradient" x1="0%" y1="60%" x2="100%" y2="10%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2242D8" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="72%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1E293B" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .tp-pulse-line {
      fill: none;
      stroke: url(#tpGradient);
      stroke-width: 34;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#softShadow);
    }
    .tp-arrow-wing {
      fill: none;
      stroke: #10B981;
      stroke-width: 32;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#softShadow);
    }
    .tp-target-ring {
      fill: #FFFFFF;
      stroke: #10B981;
      stroke-width: 14;
      filter: url(#softShadow);
    }
    .tp-text-task {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 112px;
      fill: #182230;
      letter-spacing: -2px;
    }
    .tp-text-pulse {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 112px;
      fill: #10B981;
      letter-spacing: -2px;
    }
  </style>

  <g transform="translate(48, 40)">
    <!-- Main Pulse Wave Path -->
    <path class="tp-pulse-line" d="M 60,195 L 205,195 L 275,285 L 385,75 L 475,250 L 560,150 L 640,205 L 725,65" />

    <!-- Arrow Head Wings at (725, 65) -->
    <!-- Left horizontal wing bar -->
    <line class="tp-arrow-wing" x1="725" y1="65" x2="645" y2="65" />
    <!-- Downward vertical wing bar -->
    <line class="tp-arrow-wing" x1="725" y1="65" x2="725" y2="145" />

    <!-- Arrow Target Bullseye Ring centered at tip (725, 65) -->
    <circle class="tp-target-ring" cx="725" cy="65" r="24" />

    <!-- Typography Beneath Mark -->
    <g transform="translate(42, 485)">
      <text class="tp-text-task" x="50" y="0">Task<tspan class="tp-text-pulse">Pulse</tspan></text>
    </g>
  </g>
</svg>
