<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Luminous Neon Gradient for Dark Mode -->
    <linearGradient id="tpDarkGradient" x1="0%" y1="60%" x2="100%" y2="10%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="30%" stop-color="#60A5FA" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="78%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="100%" height="100%" fill="#0B0F19" rx="28" />

  <style>
    .tp-pulse-line-dark {
      fill: none;
      stroke: url(#tpDarkGradient);
      stroke-width: 34;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neonGlow);
    }
    .tp-arrow-wing-dark {
      fill: none;
      stroke: #34D399;
      stroke-width: 32;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neonGlow);
    }
    .tp-target-ring-dark {
      fill: #0B0F19;
      stroke: #34D399;
      stroke-width: 14;
      filter: url(#neonGlow);
    }
    .tp-text-task-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 112px;
      fill: #F8FAFC;
      letter-spacing: -2px;
    }
    .tp-text-pulse-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 112px;
      fill: #34D399;
      letter-spacing: -2px;
    }
  </style>

  <g transform="translate(48, 40)">
    <!-- Main Pulse Wave Path -->
    <path class="tp-pulse-line-dark" d="M 60,195 L 205,195 L 275,285 L 385,75 L 475,250 L 560,150 L 640,205 L 725,65" />

    <!-- Arrow Head Wings at (725, 65) -->
    <line class="tp-arrow-wing-dark" x1="725" y1="65" x2="645" y2="65" />
    <line class="tp-arrow-wing-dark" x1="725" y1="65" x2="725" y2="145" />

    <!-- Arrow Target Bullseye Ring -->
    <circle class="tp-target-ring-dark" cx="725" cy="65" r="24" />

    <!-- Typography Beneath Mark -->
    <g transform="translate(42, 485)">
      <text class="tp-text-task-dark" x="50" y="0">Task<tspan class="tp-text-pulse-dark">Pulse</tspan></text>
    </g>
  </g>
</svg>
